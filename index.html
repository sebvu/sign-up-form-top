<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles/modern-css-reset.css" />
    <link rel="stylesheet" href="styles/style.css" />
    <title>Sign Up Form</title>
    <script src="scripts/script.js" defer></script>
  </head>
  <body>
    <div class="sidebar">
      <p
        class="sidebar__credits paragraph paragraph--large paragraph--text-white paragraph--bold"
      >
        Photo by Jester
      </p>
    </div>
    <div class="main-content-body">
      <div class="main-content">
        <header class="main-content__header">
          <img
            class="theme-switcher"
            alt="Toggle Light Theme Icon"
            src="assets/icons/dark-mode-icon.svg"
          />
          <h1 class="header-text">The Great Escape</h1>
        </header>
        <div
          class="main-content__block main-content__block--bottom-margin main-content__block--content-column"
        >
          <p class="paragraph paragraph--large paragraph--bold">
            You know you want to escape into the vast unknown, and from the
            realities of life. All you need is a little bit of a nudge..
          </p>
          <p class="paragraph paragraph--large paragraph--bold">
            You <span class="paragraph__span--italicize">know</span> you want
            to...
          </p>
        </div>
        <div
          class="main-content__block main-content__block--content-column main-content__block--align-center"
        >
          <h2 class="header-text header-text--small">Sign up today.</h2>
          <form class="form" method="/" action="post">
            <section class="form__section">
              <p class="paragraph">
                Please complete all the required (<span
                  class="paragraph__span--required"
                  >*</span
                >) fields.
              </p>
            </section>
            <section class="form__section form__section--gap">
              <div class="form__field-group">
                <p class="paragraph">
                  <label class="label" for="first-name">FIRST NAME</label>
                  <input
                    class="input"
                    type="text"
                    id="first-name"
                    name="first_name"
                    placeholder="John"
                    required
                  />
                  <span></span>
                </p>
                <p class="paragraph">
                  <label class="label" for="last-name">LAST NAME</label>
                  <input
                    class="input"
                    type="text"
                    id="last-name"
                    name="last_name"
                    placeholder="Doe"
                  />
                  <span></span>
                </p>
                <p class="paragraph">
                  <label class="label" for="mail">EMAIL</label>
                  <input
                    class="input"
                    type="email"
                    id="mail"
                    name="user_email"
                    placeholder="john@email.com"
                    required
                  />
                  <span></span>
                </p>
              </div>
              <div class="form__field-group">
                <p class="paragraph">
                  <label class="label" for="phone-number">PHONE NUMBER</label>
                  <input
                    class="input"
                    type="text"
                    id="phone-number"
                    name="user_number"
                  />
                  <span></span>
                </p>
                <p class="paragraph">
                  <label class="label" for="pwd">PASSWORD</label>
                  <input
                    class="input"
                    type="password"
                    id="pwd"
                    name="user_password"
                    required
                  />
                  <span></span>
                </p>
                <p class="paragraph">
                  <label class="label" for="conf-pwd">CONFIRM PASSWORD</label>
                  <input
                    class="input"
                    type="password"
                    id="conf-pwd"
                    name=""
                    required
                  />
                  <span></span>
                </p>
              </div>
            </section>
            <section class="form__section">
              <button class="form__button" type="submit">Create Account</button>
            </section>
            <section class="form__section">
              <p class="paragraph">
                Already have an account?
                <a
                  href="https://www.theodinproject.com"
                  target="_blank"
                  rel="noreferrer"
                  >Log in</a
                >
              </p>
            </section>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
